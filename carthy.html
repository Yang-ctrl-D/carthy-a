<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARTHY · Minecraft 社区</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2305070d'/%3E%3Cpolygon points='32,10 50,20 32,30 14,20' fill='%2337e6a9'/%3E%3Cpolygon points='14,20 32,30 32,50 14,40' fill='%232a1f4d'/%3E%3Cpolygon points='50,20 32,30 32,50 50,40' fill='%23a06bff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#05070d;--bg2:#0b1019;--green:#37e6a9;--green2:#12b37f;
  --cyan:#6fd7ff;--purple:#a06bff;--purple2:#7a3cf0;
  --grad:linear-gradient(118deg,#37e6a9,#6fd7ff 46%,#a06bff);
  --ink:#ecf5f2;--ink-dim:#9fb4b8;--ink-faint:#6b8188;
  --glass:rgba(15,23,36,.58);--line:rgba(168,210,212,.12);--line2:rgba(168,210,212,.22);
  --r:14px;--r2:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',system-ui,-apple-system,'Segoe UI',Roboto,'Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--green),var(--purple));border-radius:8px}

/* bg */
.bg{position:fixed;inset:0;z-index:-2;
  background:radial-gradient(1200px 600px at 50% 0%,rgba(55,230,169,.12),transparent 60%),
             radial-gradient(1000px 700px at 90% 100%,rgba(160,107,255,.14),transparent 60%),
             var(--bg)}
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.particles i{position:absolute;display:block;border-radius:2px;opacity:0;animation:float 9s linear infinite}
.particles i:nth-child(1){left:8%;top:20%;width:10px;height:10px;background:#37e6a9;box-shadow:0 0 12px #37e6a9}
.particles i:nth-child(2){left:18%;top:70%;width:6px;height:6px;background:#a06bff;box-shadow:0 0 10px #a06bff;animation-delay:1.4s}
.particles i:nth-child(3){left:30%;top:40%;width:8px;height:8px;background:#6fd7ff;box-shadow:0 0 12px #6fd7ff;animation-delay:.6s}
.particles i:nth-child(4){left:46%;top:16%;width:7px;height:7px;background:#a06bff;box-shadow:0 0 10px #a06bff;animation-delay:2s}
.particles i:nth-child(5){left:58%;top:64%;width:11px;height:11px;background:#37e6a9;box-shadow:0 0 14px #37e6a9;animation-delay:1s}
.particles i:nth-child(6){left:80%;top:55%;width:9px;height:9px;background:#a06bff;box-shadow:0 0 12px #a06bff;animation-delay:.3s}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.8}85%{opacity:.6}100%{transform:translateY(-120px);opacity:0}}

/* topbar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:60px;display:flex;align-items:center;gap:16px;
  padding:0 24px;background:linear-gradient(180deg,rgba(8,12,20,.85),rgba(8,12,20,.5));
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:900;font-size:18px}
.brand svg{width:28px;height:28px}
.nav{display:flex;gap:4px;margin-left:20px}
.nav button{background:none;border:none;color:var(--ink-dim);font-size:14px;font-weight:600;padding:8px 16px;
  border-radius:8px;cursor:pointer;transition:.2s;font-family:inherit}
.nav button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.nav button.on{color:#05110c;background:var(--grad);font-weight:800}
.right{margin-left:auto;display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 12px;border-radius:20px;
  background:var(--glass);border:1px solid var(--line);transition:.2s}
.user-chip:hover{border-color:var(--green)}
.user-chip .ava{width:24px;height:24px;border-radius:6px;background:var(--grad)}
.user-chip span{font-size:13px;color:var(--ink-dim)}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 18px;border:none;cursor:pointer;
  border-radius:10px;background:var(--grad);color:#05110c;font-weight:800;font-size:13px;transition:.2s;font-family:inherit}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(55,230,169,.35)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line2)}

/* main */
.wrap{max-width:960px;margin:0 auto;padding:84px 20px 40px}
.view{display:none}.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;backdrop-filter:blur(12px)}
.card h2{font-size:18px;font-weight:900;margin-bottom:6px}
.card .sub{font-size:13px;color:var(--ink-faint);margin-bottom:14px}

/* bug list */
.bug{padding:14px;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:10px;background:rgba(255,255,255,.02)}
.bug-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bug-title{font-weight:700;font-size:14px;flex:1}
.bug-badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700}
.bug-badge.open{background:rgba(55,230,169,.15);color:var(--green)}
.bug-badge.closed{background:rgba(255,120,120,.15);color:#ff9898}
.bug-meta{font-size:12px;color:var(--ink-faint)}
.bug-body{font-size:13px;color:var(--ink-dim);margin-top:8px;line-height:1.6;white-space:pre-wrap}

/* login modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:28px;width:380px;max-width:92vw;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-size:20px;font-weight:900;margin-bottom:4px}
.modal .msub{font-size:13px;color:var(--ink-faint);margin-bottom:20px}
.modal label{display:block;font-size:12px;color:var(--ink-dim);margin:12px 0 4px}
.modal input{width:100%;height:40px;border:1px solid var(--line2);border-radius:8px;background:rgba(255,255,255,.04);
  padding:0 12px;color:var(--ink);font-size:14px;outline:none;font-family:inherit}
.modal input:focus{border-color:var(--green)}
.modal .row{display:flex;gap:8px}
.modal .row input{flex:1}
.modal .btn{width:100%;justify-content:center;margin-top:18px}
.modal .foot{font-size:12px;color:var(--ink-faint);margin-top:14px;text-align:center}
.modal .close{float:right;background:none;border:none;color:var(--ink-faint);font-size:20px;cursor:pointer}
.modal .close:hover{color:var(--ink)}

/* toast */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--green);
  color:var(--ink);padding:12px 24px;border-radius:10px;font-size:14px;z-index:200;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}

/* welcome */
.welcome{text-align:center;padding:40px 0}
.welcome h1{font-size:32px;font-weight:900;margin-bottom:8px}
.welcome h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--ink-dim);font-size:15px}
</style>
</head>
<body>

<div class="bg"></div>
<div class="partaurants"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<!-- topbar -->
<div class="topbar">
  <div class="brand" onclick="show('home')">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="#05070d"/><polygon points="32,10 50,20 32,30 14,20" fill="#37e6a9"/><polygon points="14,20 32,30 32,50 14,40" fill="#2a1f4d"/><polygon points="50,20 32,30 32,50 50,40" fill="#a06bff"/></svg>
    CARTHY
  </div>
  <div class="nav">
    <button class="on" onclick="show('home',this)">首页</button>
    <button onclick="show('bugs',this)">Bug 反馈</button>
  </div>
  <div class="right">
    <div class="user-chip" id="userChip" onclick="openLogin()" style="display:none">
      <div class="ava"></div><span id="userName">玩家</span>
    </div>
    <button class="btn" id="loginBtn" onclick="openLogin()">登录 / 注册</button>
  </div>
</div>

<div class="wrap">

  <!-- HOME -->
  <div class="view on" id="v-home">
    <div class="welcome">
      <h1>欢迎来到 <span>CARTHY</span></h1>
      <p>Minecraft 玩家社区 · 启动器交流 · Bug 反馈</p>
    </div>
    <div class="card">
      <h2>关于 CARTHY</h2>
      <div class="sub">一个简洁的 Minecraft 启动器社区</div>
      <p style="color:var(--ink-dim);font-size:14px;line-height:1.8">
        CARTHY 启动器支持正版登录、外置登录（LittleSkin）、自动下载 Java、BMCLAPI 多源加速下载。
        你可以在这里查看已知 Bug，反馈遇到的问题。
      </p>
    </div>
    <div class="card">
      <h2>快速开始</h2>
      <div class="sub">登录后即可使用社区功能</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
        <span class="chip" style="padding:6px 14px;border-radius:8px;border:1px solid var(--line2);font-size:13px">正版登录</span>
        <span class="chip" style="padding:6px 14px;border-radius:8px;border:1px solid var(--line2);font-size:13px">外置登录</span>
        <span class="chip" style="padding:6px 14px;border-radius:8px;border:1px solid var(--line2);font-size:13px">邮箱注册</span>
        <span class="chip" style="padding:6px 14px;border-radius:8px;border:1px solid var(--line2);font-size:13px">自动 Java</span>
      </div>
    </div>
  </div>

  <!-- BUGS -->
  <div class="view" id="v-bugs">
    <div class="card">
      <h2>Bug 反馈</h2>
      <div class="sub">从 GitHub 仓库实时加载的问题列表</div>
      <div id="bugList"><p style="color:var(--ink-faint);font-size:14px">加载中...</p></div>
    </div>
  </div>

</div>

<!-- LOGIN MODAL -->
<div class="overlay" id="loginOverlay" onclick="if(event.target===this)closeLogin()">
  <div class="modal">
    <button class="close" onclick="closeLogin()">×</button>
    <h3>登录 <span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">CARTHY</span></h3>
    <div class="msub">登录后即可参与社区</div>

    <label>邮箱</label>
    <input id="liEmail" type="email" placeholder="your@email.com">
    <label>密码</label>
    <input id="liPwd" type="password" placeholder="••••••••">

    <button class="btn" onclick="doLogin()">登录</button>
    <div class="foot">腐竹账号已内置 · 新用户自动注册</div>
  </div>
</div>

<div id="toast"></div>

<script>
// ===== CONFIG =====
var ADMIN_EMAIL = '3962892029@qq.com';
var ADMIN_PWD = "6fd7h8d6s4f'h/f'h'\\f\\h'\\jjgugIlIIl//;";
var BANNED = ['傻逼','操你妈','滚蛋','垃圾', 'shit','fuck'];
var GH_REPO = 'Yang-ctrl-D/carthy-a';

// ===== STATE =====
var user = JSON.parse(localStorage.getItem('carthy_user')||'null');

// ===== ROUTING =====
function show(v,btn){
  document.querySelectorAll('.view').forEach(function(e){e.classList.remove('on')});
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('on')});
  if(btn) btn.classList.add('on');
  if(v==='bugs') loadBugs();
}

// ===== LOGIN =====
function openLogin(){
  if(user){
    // logged in, show logout option
    if(confirm('当前登录：'+user.name+'\n\n点击确定退出登录')){
      localStorage.removeItem('carthy_user');
      user=null;
      refreshUser();
      toast('已退出登录');
    }
    return;
  }
  document.getElementById('loginOverlay').classList.add('open');
}
function closeLogin(){ document.getElementById('loginOverlay').classList.remove('open'); }

function doLogin(){
  var em = document.getElementById('liEmail').value.trim();
  var pw = document.getElementById('liPwd').value;
  if(!em || !pw){ toast('请输入邮箱和密码'); return; }

  // check banned words in email
  for(var i=0;i<BANNED.length;i++){
    if(em.toLowerCase().indexOf(BANNED[i].toLowerCase())>=0){ toast('邮箱包含违规词'); return; }
  }

  if(em===ADMIN_EMAIL && pw===ADMIN_PWD){
    user = {email:em, name:'腐竹', role:'admin'};
  } else {
    // auto-register as player
    user = {email:em, name:em.split('@')[0], role:'player'};
  }
  localStorage.setItem('carthy_user', JSON.stringify(user));
  refreshUser();
  closeLogin();
  toast('欢迎，'+user.name+'！');
}

function refreshUser(){
  if(user){
    document.getElementById('userChip').style.display='flex';
    document.getElementById('userName').textContent = user.role==='admin'?'腐竹':user.name;
    document.getElementById('loginBtn').style.display='none';
  } else {
    document.getElementById('userChip').style.display='none';
    document.getElementById('loginBtn').style.display='';
  }
}

// ===== BUGS (GitHub Issues) =====
function loadBugs(){
  var el = document.getElementById('bugList');
  el.innerHTML = '<p style="color:var(--ink-faint);font-size:14px">加载中...</p>';
  fetch('https://api.github.com/repos/'+GH_REPO+'/issues?state=all&per_page=20')
    .then(function(r){return r.json()})
    .then(function(issues){
      if(!issues || !issues.length){
        el.innerHTML = '<p style="color:var(--ink-faint);font-size:14px">暂无 Bug 报告</p>';
        return;
      }
      el.innerHTML = issues.map(function(i){
        var closed = i.state==='closed';
        return '<div class="bug">'+
          '<div class="bug-head">'+
            '<span class="bug-title">'+esc(i.title)+'</span>'+
            '<span class="bug-badge '+(closed?'closed':'open')+'">'+(closed?'已解决':'待处理')+'</span>'+
          '</div>'+
          '<div class="bug-meta">#'+i.number+' · '+i.user.login+' · '+new Date(i.created_at).toLocaleDateString()+'</div>'+
          (i.body?'<div class="bug-body">'+esc(i.body.substring(0,300))+'</div>':'')+
        '</div>';
      }).join('');
    })
    .catch(function(){
      el.innerHTML = '<p style="color:var(--ink-faint);font-size:14px">加载失败，请稍后刷新</p>';
    });
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ===== TOAST =====
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none'},2500);
}

// ===== INIT =====
refreshUser();
</script>
</body>
</html>
