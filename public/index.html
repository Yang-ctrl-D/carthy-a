<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarthY 绀惧尯</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
a{color:#818cf8;text-decoration:none;cursor:pointer}
.container{max-width:1000px;margin:0 auto;padding:20px}
header{background:rgba(15,23,42,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);padding:12px 0;position:sticky;top:0;z-index:10}
header .inner{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto;padding:0 20px}
.logo{font-size:18px;font-weight:700;cursor:pointer}
.logo span{color:#818cf8}
nav{display:flex;gap:4px;align-items:center}
nav a{padding:6px 12px;border-radius:8px;font-size:13px;color:#94a3b8;cursor:pointer}
nav a:hover,nav a.active{background:rgba(99,102,241,.15);color:#fff}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;transition:.2s}
.btn-p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.4)}
.btn-g{background:rgba(255,255,255,.06);color:#cbd5e1}
.btn-g:hover{background:rgba(255,255,255,.1)}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.item:last-child{border:none}
.item:hover{background:rgba(255,255,255,.02)}
.avatar{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:6px}
input,textarea,select{width:100%;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);color:#fff;font-size:14px;margin-bottom:8px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:#6366f1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.on{display:flex}
.modal{background:#1e293b;border-radius:14px;padding:24px;width:380px;border:1px solid rgba(255,255,255,.1)}
.modal h2{margin-bottom:16px;font-size:17px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs .tab{flex:1;padding:7px;text-align:center;border-radius:8px;cursor:pointer;font-size:12px;background:rgba(255,255,255,.04)}
.tabs .tab.on{background:#6366f1;color:#fff}
.cats{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:16px;background:rgba(255,255,255,.06);cursor:pointer;font-size:12px}
.pill.on{background:#6366f1}
.err{color:#f87171;font-size:12px;margin-top:6px}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;background:#6366f1;color:#fff;margin-left:6px}
.reply{border-top:1px solid rgba(255,255,255,.06);padding:10px 0}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="logo" onclick="show('home')">CarthY<span>绀惧尯</span></div>
    <nav>
      <a class="navlink" data-p="home" onclick="show('home')">棣栭〉</a>
      <a class="navlink" data-p="multi" onclick="show('multi')">鑱旀満澶у巺</a>
      <a class="navlink" data-p="friends" onclick="show('friends')">濂藉弸</a>
      <span id="navUser"></span>
      <button class="btn btn-p" id="loginBtn" onclick="openLogin()">鐧诲綍</button>
    </nav>
  </div>
</header>
<div class="container" id="view"></div>

<div class="modal-bg" id="loginModal">
  <div class="modal">
    <h2>鐧诲綍 CarthY</h2>
    <div class="tabs">
      <div class="tab on" data-t="ls" onclick="ltab('ls')">澶栫疆鐧诲綍</div>
      <div class="tab" data-t="ms" onclick="ltab('ms')">寰蒋姝ｇ増</div>
    </div>
    <div id="lsForm">
      <input id="lsUser" placeholder="LittleSkin 鐢ㄦ埛鍚?閭">
      <input id="lsPass" type="password" placeholder="瀵嗙爜">
      <button class="btn btn-p" style="width:100%" onclick="lsLogin()">鐧诲綍</button>
    </div>
    <div id="msForm" style="display:none">
      <p style="font-size:12px;color:#94a3b8;margin-bottom:12px">浣跨敤寰蒋姝ｇ増璐﹀彿鐧诲綍锛岃嚜鍔ㄨ幏鍙栨父鎴忔樀绉般€?/p>
      <a class="btn btn-p" style="display:block;text-align:center" href="/auth/microsoft">寰蒋璐﹀彿鐧诲綍</a>
    </div>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="modal-bg" id="newModal">
  <div class="modal" style="width:460px">
    <h2>鍙戝竷鏂板笘</h2>
    <select id="newCat"></select>
    <input id="newTitle" placeholder="鏍囬">
    <textarea id="newContent" rows="4" placeholder="鍐呭..."></textarea>
    <input id="newFileUrl" placeholder="涓嬭浇閾炬帴锛堝彲閫夛級">
    <input id="newFileName" placeholder="璧勬簮鍚嶇О锛堝彲閫夛級">
    <button class="btn btn-p" style="width:100%" onclick="postThread()">鍙戝竷</button>
  </div>
</div>

<script>
let me = null, currentCat = null;

async function api(url, opts) { const r = await fetch(url, opts); return r.json(); }

async function loadMe() {
  me = await api('/api/me');
  const nav = document.getElementById('navUser');
  const btn = document.getElementById('loginBtn');
  if (me) {
    nav.innerHTML = `<img class="avatar" src="${me.avatar}" onerror="this.style.display='none'"><span style="font-size:13px;margin-right:8px">${me.name}</span>`;
    btn.textContent = '閫€鍑?; btn.onclick = async () => { await api('/api/logout',{method:'POST'}); location.reload(); };
  } else {
    nav.innerHTML = '';
    btn.textContent = '鐧诲綍'; btn.onclick = openLogin;
  }
}

function show(page) {
  document.querySelectorAll('.navlink').forEach(a => a.classList.toggle('active', a.dataset.p === page));
  if (page === 'home') renderHome();
  else if (page === 'multi') renderMulti();
  else if (page === 'friends') renderFriends();
}

async function renderHome() {
  const cats = await api('/api/categories');
  const threads = await api('/api/threads' + (currentCat ? '?cat='+currentCat : ''));
  document.getElementById('view').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:18px">绀惧尯</h2>
      <button class="btn btn-p" onclick="openNew()">鍙戝笘</button>
    </div>
    <div class="cats">
      <span class="pill ${!currentCat?'on':''}" onclick="currentCat=null;renderHome()">鍏ㄩ儴</span>
      ${cats.map(c=>`<span class="pill ${currentCat==c.id?'on':''}" onclick="currentCat=${c.id};renderHome()">${c.name}</span>`).join('')}
    </div>
    <div class="card">
      ${threads.length ? threads.map(t=>`
        <div class="item" onclick="openThread(${t.id})">
          <div>
            <div style="font-size:14px;font-weight:600">${t.title}${t.file_url?'<span class="tag">璧勬簮</span>':''}</div>
            <div style="font-size:11px;color:#64748b;margin-top:3px">
              <img class="avatar" src="${t.avatar}" onerror="this.style.display='none'" style="width:18px;height:18px">
              ${t.author} 路 ${new Date(t.created_at*1000).toLocaleDateString()} 路 娴忚 ${t.views}
            </div>
          </div>
          ${t.file_name?`<span style="font-size:11px;color:#818cf8">${t.file_name}</span>`:''}
        </div>`).join('') : '<div style="padding:20px;text-align:center;color:#64748b">鏆傛棤甯栧瓙</div>'}
    </div>`;
}

async function openThread(id) {
  const d = await api('/api/thread/'+id);
  document.getElementById('view').innerHTML = `
    <button class="btn btn-g" onclick="show('home')" style="margin-bottom:12px">鈫?杩斿洖</button>
    <div class="card">
      <h2 style="font-size:18px;margin-bottom:6px">${d.thread.title}</h2>
      <div style="font-size:11px;color:#64748b;margin-bottom:12px">
        <img class="avatar" src="${d.thread.avatar}" onerror="this.style.display='none'" style="width:18px;height:18px">
        ${d.thread.author} 路 ${new Date(d.thread.created_at*1000).toLocaleString()}
      </div>
      <p style="line-height:1.7">${d.thread.content}</p>
      ${d.thread.file_url?`<p style="margin-top:12px"><a class="btn btn-p" href="${d.thread.file_url}" target="_blank">涓嬭浇: ${d.thread.file_name||'璧勬簮'}</a></p>`:''}
    </div>
    <div class="card">
      ${d.posts.map(p=>`<div class="reply">
        <div style="font-size:12px;color:#64748b"><img class="avatar" src="${p.avatar}" onerror="this.style.display='none'" style="width:18px;height:18px">${p.author} 路 ${new Date(p.created_at*1000).toLocaleString()}</div>
        <p style="margin-top:6px">${p.content}</p>
      </div>`).join('')}
    </div>
    <div class="card">
      <textarea id="replyBox" rows="2" placeholder="鍥炲..."></textarea>
      <button class="btn btn-p" onclick="postReply(${id})">鍥炲</button>
    </div>`;
}

async function postReply(id) {
  if (!me) return openLogin();
  await api('/api/reply/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:document.getElementById('replyBox').value})});
  openThread(id);
}

async function openNew() {
  if (!me) return openLogin();
  const cats = await api('/api/categories');
  document.getElementById('newCat').innerHTML = cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('newModal').classList.add('on');
}

async function postThread() {
  await api('/api/thread',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    category_id:document.getElementById('newCat').value,
    title:document.getElementById('newTitle').value,
    content:document.getElementById('newContent').value,
    file_url:document.getElementById('newFileUrl').value,
    file_name:document.getElementById('newFileName').value
  })});
  document.getElementById('newModal').classList.remove('on');
  renderHome();
}

async function renderMulti() {
  const rooms = await api('/api/rooms');
  document.getElementById('view').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:18px">鑱旀満澶у巺</h2>
      <button class="btn btn-p" onclick="createRoom()">鍒涘缓鎴块棿</button>
    </div>
    <div class="card">
      ${rooms.length ? rooms.map(r=>`
        <div class="item">
          <div>
            <div style="font-size:14px;font-weight:600">${r.name}</div>
            <div style="font-size:11px;color:#64748b;margin-top:3px">
              <img class="avatar" src="${r.host_avatar}" onerror="this.style.display='none'" style="width:18px;height:18px">
              ${r.host_name} 路 MC ${r.version} 路 ${r.online}/${r.max} 浜?            </div>
            ${r.motd?`<div style="font-size:12px;color:#94a3b8;margin-top:4px">${r.motd}</div>`:''}
          </div>
          <div style="text-align:right">
            <div style="font-size:13px;color:#818cf8">${r.ip}:${r.port}</div>
            <button class="btn btn-g" style="margin-top:6px" onclick="navigator.clipboard.writeText('${r.ip}:${r.port}');this.textContent='宸插鍒?">澶嶅埗鍦板潃</button>
          </div>
        </div>`).join('') : '<div style="padding:20px;text-align:center;color:#64748b">鏆傛棤鎴块棿锛岀偣鍙充笂瑙掑垱寤?/div>'}
    </div>`;
}

async function createRoom() {
  if (!me) return openLogin();
  const name = prompt('鎴块棿鍚嶇О:'); if(!name) return;
  const ip = prompt('鏈嶅姟鍣↖P:'); if(!ip) return;
  const version = prompt('娓告垙鐗堟湰 (濡?1.20.1):','1.20.1');
  const motd = prompt('绠€浠?鍙€?:') || '';
  await api('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,ip,version,motd})});
  renderMulti();
}

async function renderFriends() {
  const list = await api('/api/friends');
  document.getElementById('view').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:18px">濂藉弸</h2>
      <button class="btn btn-p" onclick="addFriend()">娣诲姞濂藉弸</button>
    </div>
    <div class="card">
      ${list.length ? list.map(f=>`
        <div class="item">
          <div>
            <img class="avatar" src="${f.avatar}" onerror="this.style.display='none'">
            <span style="font-size:14px">${f.name}</span>
            <span class="tag">${f.auth_type==='external'?'澶栫疆':f.auth_type==='microsoft'?'姝ｇ増':'绂荤嚎'}</span>
          </div>
          <span style="font-size:12px;color:${f.status==='accepted'?'#34d399':'#fbbf24'}">${f.status==='accepted'?'宸叉坊鍔?:'寰呯‘璁?}</span>
        </div>`).join('') : '<div style="padding:20px;text-align:center;color:#64748b">鏆傛棤濂藉弸锛岀偣鍙充笂瑙掓坊鍔?/div>'}
    </div>`;
}

async function addFriend() {
  if (!me) return openLogin();
  const name = prompt('杈撳叆瀵规柟鐢ㄦ埛鍚?'); if(!name) return;
  const r = await api('/api/friend/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  alert(r.ok ? '宸插彂閫佸ソ鍙嬭姹? : r.error);
}

function openLogin(){document.getElementById('loginModal').classList.add('on')}
function ltab(t){
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.t===t));
  document.getElementById('lsForm').style.display=t==='ls'?'block':'none';
  document.getElementById('msForm').style.display=t==='ms'?'block':'none';
}
async function lsLogin(){
  const r = await api('/api/login/littleskin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('lsUser').value,password:document.getElementById('lsPass').value})});
  if(r.ok) location.reload();
  else document.getElementById('loginErr').textContent = r.error;
}

loadMe().then(()=>show('home'));
</script>
</body>
</html>
