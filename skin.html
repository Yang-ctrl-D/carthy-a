<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarthY 皮肤站</title>
<style>
:root{
  --bg:#0a0e1a;--glass:rgba(15,20,35,.75);--glass2:rgba(25,35,55,.6);
  --line:rgba(80,120,160,.2);--ink:#e0e8f0;--dim:#7a8a9a;
  --green:#3dd68c;--purple:#a78bfa;--cyan:#22d3ee;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse at 20% 80%,rgba(60,180,100,.15),transparent 50%),
  radial-gradient(ellipse at 80% 20%,rgba(120,80,200,.15),transparent 50%),
  radial-gradient(ellipse at 50% 100%,rgba(40,120,80,.1),transparent 60%);z-index:-1}
.header{background:var(--glass);backdrop-filter:blur(20px);padding:16px 28px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.logo{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search{flex:1;max-width:400px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font-size:14px;outline:none}
.nav-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);cursor:pointer;font-size:14px;transition:.2s}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn-primary{background:linear-gradient(90deg,var(--green),var(--cyan));color:#0a0e1a;border:none;font-weight:600}
.btn-primary:hover{opacity:.9;color:#0a0e1a}
.status-dot{width:8px;height:8px;border-radius:50%;background:#f66;display:inline-block;margin-right:6px}
.status-dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.layout{display:flex;max-width:1200px;margin:20px auto;gap:16px;padding:0 20px}
.sidebar{width:160px;flex-shrink:0;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:80px;height:fit-content}
.nav-item{padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--dim);transition:.2s;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.nav-item:hover{background:var(--glass2);color:var(--ink)}
.nav-item.active{background:linear-gradient(90deg,rgba(61,214,140,.15),rgba(34,211,238,.1));color:var(--green)}
.main{flex:1;min-width:0}
.card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;color:var(--ink)}
.card .sub{font-size:12px;color:var(--dim);margin-bottom:16px}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.skin-item{background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;transition:.2s}
.skin-item:hover{border-color:var(--green);transform:translateY(-2px)}
.skin-avatar{width:48px;height:96px;margin:0 auto;background:#1a2540;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:32px}
.skin-name{font-size:12px;margin-top:8px;color:var(--dim)}
.input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);margin:6px 0;font-size:14px;outline:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:16px;padding:24px;width:380px;max-width:90%}
.modal h3{margin-bottom:16px}
.msg{font-size:13px;margin-top:10px}
.msg.ok{color:var(--green)}
.msg.err{color:#f66}
.hidden{display:none}
</style>
</head>
<body>
<div class="header">
  <div class="logo">CarthY</div>
  <input class="search" placeholder="搜索皮肤...">
  <div class="nav-right">
    <span id="srvStatus" style="font-size:12px;color:var(--dim)"><span class="status-dot" id="srvDot"></span>连接中...</span>
    <button class="btn" id="btnAccount" onclick="showLogin()">登录/注册</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="nav-item active" onclick="showTab('browse',this)">🏠 皮肤商城</div>
    <div class="nav-item" onclick="showTab('mine',this)">👤 我的皮肤</div>
    <div class="nav-item" onclick="showTab('upload',this)">⬆️ 上传皮肤</div>
    <div class="nav-item" onclick="window.open('https://yang-ctrl-d.github.io/carthy-a/carthy.html','_blank')">🏠 返回论坛</div>
  </div>

  <div class="main">
    <div id="tabBrowse" class="card">
      <h3>热门皮肤</h3>
      <div class="sub">点击皮肤即可使用</div>
      <div class="skin-grid" id="skinGrid"></div>
    </div>

    <div id="tabMine" class="card hidden">
      <h3>我的资料</h3>
      <div id="mineInfo"><p style="color:var(--dim)">请先登录</p></div>
    </div>

    <div id="tabUpload" class="card hidden">
      <h3>上传皮肤</h3>
      <div class="sub">选择 64x64 或 64x128 的 PNG 皮肤文件</div>
      <input type="file" id="skinFile" accept=".png" class="input">
      <button class="btn btn-primary" onclick="uploadSkin()" style="margin-top:10px">上传并使用</button>
      <div id="uploadMsg"></div>
    </div>
  </div>
</div>

<div id="loginModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>登录 / 注册</h3>
    <input id="loginUser" class="input" placeholder="用户名">
    <input id="loginPass" class="input" type="password" placeholder="密码">
    <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="doLogin()">登录 / 注册</button>
    <div id="loginMsg"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="closeLogin()">关闭</button>
  </div>
</div>

<script>
var API='https://sparkling-scene-7bfb.3962892029.workers.dev';
var user=JSON.parse(localStorage.getItem('carthy_skin_user')||'null');

// Check server connection
async function checkServer(){
  try{
    var r=await fetch(API+'/',{method:'GET',signal:AbortSignal.timeout(8000)});
    document.getElementById('srvDot').classList.add('on');
    document.getElementById('srvStatus').innerHTML='<span class="status-dot on"></span>服务器已连接';
  }catch(e){
    document.getElementById('srvStatus').innerHTML='<span class="status-dot"></span>服务器未连接';
  }
}
checkServer();

function showTab(t,el){
  document.querySelectorAll('.nav-item').forEach(function(e){e.classList.remove('active')});
  if(el)el.classList.add('active');
  ['Browse','Mine','Upload'].forEach(function(x){
    document.getElementById('tab'+x).classList.toggle('hidden',x.toLowerCase()!==t);
  });
  if(t==='mine'&&user)loadMine();
}

function showLogin(){document.getElementById('loginModal').classList.remove('hidden')}
function closeLogin(){document.getElementById('loginModal').classList.add('hidden')}

async function doLogin(){
  var u=document.getElementById('loginUser').value.trim();
  var p=document.getElementById('loginPass').value;
  var msg=document.getElementById('loginMsg');
  if(!u||!p){msg.innerHTML='<div class="msg err">请输入用户名和密码</div>';return}
  msg.innerHTML='<div class="msg">连接中...</div>';
  try{
    var r=await fetch(API+'/authserver/authenticate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p})
    });
    var d=await r.json();
    if(d.accessToken){
      user={name:u,token:d.accessToken,uuid:d.selectedProfile.id};
      localStorage.setItem('carthy_skin_user',JSON.stringify(user));
      document.getElementById('btnAccount').textContent=u;
      msg.innerHTML='<div class="msg ok">登录成功！</div>';
      setTimeout(closeLogin,800);loadMine();
    }else{
      msg.innerHTML='<div class="msg err">登录失败：'+(d.errorMessage||'未知错误')+'</div>';
    }
  }catch(e){
    msg.innerHTML='<div class="msg err">服务器连接失败，请稍后再试</div>';
  }
}

function loadMine(){
  if(!user)return;
  document.getElementById('mineInfo').innerHTML=
    '<p style="margin:8px 0">用户名：<b>'+user.name+'</b></p>'+
    '<p style="margin:8px 0">UUID：'+user.uuid+'</p>'+
    '<button class="btn" style="margin-top:12px" onclick="logout()">退出登录</button>';
}

async function uploadSkin(){
  if(!user){alert('请先登录');showLogin();return}
  var f=document.getElementById('skinFile').files[0];
  var msg=document.getElementById('uploadMsg');
  if(!f){msg.innerHTML='<div class="msg err">请选择文件</div>';return}
  var reader=new FileReader();
  reader.onload=async function(){
    var b64=reader.result.split(',')[1];
    msg.innerHTML='<div class="msg">上传中...</div>';
    try{
      var r=await fetch(API+'/api/skin',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:user.name,skin:'data:image/png;base64,'+b64})
      });
      var d=await r.json();
      if(d.success)msg.innerHTML='<div class="msg ok">皮肤上传成功！</div>';
      else msg.innerHTML='<div class="msg err">上传失败</div>';
    }catch(e){msg.innerHTML='<div class="msg err">服务器错误</div>'}
  };
  reader.readAsDataURL(f);
}

function logout(){localStorage.removeItem('carthy_skin_user');user=null;document.getElementById('btnAccount').textContent='登录/注册';loadMine()}

var demos=[
  {name:'Steve',icon:'🧍'},{name:'Alex',icon:'🧑'},{name:'骑士',icon:'🛡️'},
  {name:'勇者',icon:'⚔️'},{name:'法师',icon:'🔮'},{name:'忍者',icon:'🥷'},
  {name:'机器人',icon:'🤖'},{name:'骷髅',icon:'💀'},
  {name:'龙骑士',icon:'🐉'},{name:'精灵',icon:'🧝'},{name:'恶魔',icon:'😈'},{name:'天使',icon:'👼'}
];
var grid=document.getElementById('skinGrid');
demos.forEach(function(s){
  grid.innerHTML+='<div class="skin-item" onclick="alert(\'登录后可使用皮肤\')"><div class="skin-avatar">'+s.icon+'</div><div class="skin-name">'+s.name+'</div></div>';
});

if(user){document.getElementById('btnAccount').textContent=user.name;loadMine()}
</script>
</body>
</html>
